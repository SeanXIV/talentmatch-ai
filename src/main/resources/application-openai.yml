# Hosted OpenAI (paid; demos only). Requires OPENAI_API_KEY; never commit keys.
talentmatch:
  ai:
    provider: openai
    call-timeout: 30s
    request-budget: 12s
    max-concurrency: 4
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:}
      model: ${OPENAI_MODEL:gpt-4.1-mini}
      temperature: 0.2
      max-output-tokens: 500
